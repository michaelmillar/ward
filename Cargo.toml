[package]
name = "ward"
version = "0.2.0"
edition = "2021"
description = "Proof-before-delete archival for local Git repositories"
license = "MIT"
repository = "https://github.com/michaelmillar/ward"
homepage = "https://github.com/michaelmillar/ward"
readme = "README.md"
keywords = ["git", "archive", "cleanup", "developer-tools", "disk-space"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ward"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
colored = "2"
flate2 = "1"
hex = "0.4"
rayon = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
